services:
  postgresDb:
   image: postgres:17
   restart: unless-stopped
   ports:
    - "5432:5432"
   environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: OIDC-IMPLEMENTATION

   volumes:
    - postgres_data:/var/lib/postgresql/data

  redis:
   image: redis:7
   restart: unless-stopped
   ports:
    - "6379:6379"
   volumes:
    - redis_data:/data

volumes:
  postgres_data:
  redis_data: